name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: g++
            cxx: g++
          - os: ubuntu-22.04
            compiler: clang++
            cxx: clang++
          - os: macos-14
            compiler: clang++
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make clean build CXX=${{ matrix.cxx }}

      - name: Test
        run: make test CXX=${{ matrix.cxx }}

  warnings-as-errors:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build and test with strict warnings
        run: make clean test CXX=g++ CXXFLAGS="-std=c++17 -Wall -Wextra -Wpedantic -Werror -fPIC -Iinclude"
